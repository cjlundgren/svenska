<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Små steg</title>
<link rel="icon" href="data:,">
<style>
@font-face { font-family: "Fraunces"; src: url("lib/fonts/fraunces.woff2") format("woff2"); font-weight: 500 700; font-display: swap; }
@font-face { font-family: "Inter"; src: url("lib/fonts/inter.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }

:root {
  --paper: #f6f2ea;
  --card: #ffffff;
  --ink: #1d1f24;
  --muted: #676a72;
  --line: #e3ddd1;
  --accent: #2b5c8a;
  --accent-ink: #ffffff;
  --accent-soft: #e2ecf5;
  --sun: #d99a1b;
  --sun-soft: #fbf0d4;
  --ok: #2f7a4a;
  --ok-soft: #ddefe2;
  --fel: #b4432f;
  --fel-soft: #f6e0da;
  --c-lyssna: #2b6cb0; --c-lyssna-soft: #e1ecf8;
  --c-aha: #c98a0c; --c-aha-soft: #fbf0d4;
  --c-testa: #2f855a; --c-testa-soft: #dcf0e4;
  --c-saga: #d0583a; --c-saga-soft: #fae3dc;
  --c-ord: #7556c2; --c-ord-soft: #ebe5f8;
  --g-en: #1d63c9; --g-ett: #c4470f;
  --o-verb: #c53030; --o-subst: #1d63c9; --o-adj: #2f855a; --o-pron: #7556c2;
  --p-erik: #0e7c7b; --p-karin: #b83280; --p-kassoren: #64748b; --p-elsa: #b7791f; --p-olle: #4c51bf;
  --k1: #4c51bf; --k2: #2f855a; --k3: #b7791f; --k4: #b83280;
  --radius: 16px;
  --serif: "Fraunces", Georgia, serif;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #15171b; --card: #1e2127; --ink: #ecebe7; --muted: #a3a6ad; --line: #32363e;
    --accent: #84b3e2; --accent-ink: #0f1a26; --accent-soft: #1f3044;
    --sun: #f0c460; --sun-soft: #3a3020; --ok: #6fc28c; --ok-soft: #1d3326; --fel: #e48a76; --fel-soft: #3d231e;
    --c-lyssna: #7fb2ea; --c-lyssna-soft: #1e2f44; --c-aha: #f0c460; --c-aha-soft: #3a3020; --c-testa: #6fc28c; --c-testa-soft: #1d3326;
    --c-saga: #f0907a; --c-saga-soft: #40261f; --c-ord: #b39cf0; --c-ord-soft: #2c2541;
    --g-en: #7cb4f5; --g-ett: #f5a06b;
    --o-verb: #f28b8b; --o-subst: #7cb4f5; --o-adj: #6fc28c; --o-pron: #b39cf0;
    --p-erik: #4fd1c5; --p-karin: #f08fc4; --p-kassoren: #a0aec0; --p-elsa: #f6c26b; --p-olle: #a3a8f5;
    --k1: #a3a8f5; --k2: #6fc28c; --k3: #f6c26b; --k4: #f08fc4;
  }
}
:root[data-theme="dark"] {
  --paper: #15171b; --card: #1e2127; --ink: #ecebe7; --muted: #a3a6ad; --line: #32363e;
  --accent: #84b3e2; --accent-ink: #0f1a26; --accent-soft: #1f3044;
  --sun: #f0c460; --sun-soft: #3a3020; --ok: #6fc28c; --ok-soft: #1d3326; --fel: #e48a76; --fel-soft: #3d231e;
  --c-lyssna: #7fb2ea; --c-lyssna-soft: #1e2f44; --c-aha: #f0c460; --c-aha-soft: #3a3020; --c-testa: #6fc28c; --c-testa-soft: #1d3326;
  --c-saga: #f0907a; --c-saga-soft: #40261f; --c-ord: #b39cf0; --c-ord-soft: #2c2541;
  --g-en: #7cb4f5; --g-ett: #f5a06b;
  --o-verb: #f28b8b; --o-subst: #7cb4f5; --o-adj: #6fc28c; --o-pron: #b39cf0;
  --p-erik: #4fd1c5; --p-karin: #f08fc4; --p-kassoren: #a0aec0; --p-elsa: #f6c26b; --p-olle: #a3a8f5;
  --k1: #a3a8f5; --k2: #6fc28c; --k3: #f6c26b; --k4: #f08fc4;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.55 var(--sans); }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; line-height: 1.2; margin: 0; }
p { margin: 0 0 .7em; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.topp { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.topp-inre { max-width: 640px; min-height: 56px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 12px; }
.logga { font-family: var(--serif); font-weight: 700; font-size: 1.2rem; color: var(--ink); text-decoration: none; margin-right: auto; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--card);
  border: 1px solid var(--line); color: var(--ink); text-decoration: none; font-size: .9rem; font-weight: 600; }
.badge { background: var(--sun); color: #1d1f24; border-radius: 999px; padding: 0 7px; font-size: .8rem; font-weight: 700; }
#stegval { display: none; flex: 1; min-width: 0; height: 38px; padding: 0 8px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink); font: 600 .92rem var(--sans); }

/* Sidomeny (dator) och stegval i toppen (mobil) */
.sidebar { display: none; }
.nav-verktyg { display: flex; gap: 12px; margin: 0 8px 12px; font-size: .78rem; }
.nav-verktyg button { border: 0; background: none; padding: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.nav-verktyg button:hover { color: var(--ink); }
.nav-topp { display: grid; gap: 2px; margin-bottom: 16px; }
.nav-item { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 6px; padding: 7px 8px; border-radius: 9px;
  text-decoration: none; color: var(--ink); font-size: .92rem; }
.nav-item:hover { background: color-mix(in srgb, var(--line) 65%, transparent); }
.nav-item .nid { font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.nav-item .prog { font-size: .78rem; color: var(--muted); font-weight: 600; }
.nav-item.klar .nid, .nav-item.klar .prog { color: var(--ok); }
.nav-item.aktiv { background: var(--ink); color: var(--paper); }
.nav-item.aktiv .nid { color: var(--sun); }
.nav-item.aktiv .prog { color: inherit; }
.nav-item.kommer { opacity: .45; cursor: default; }
.nav-item.kommer:hover { background: none; }
.nav-kap { margin: 0 0 16px; }
.nav-kap > summary { list-style: none; cursor: pointer; display: flex; gap: 9px; align-items: flex-start; padding: 4px 6px; border-radius: 8px; }
.nav-kap > summary::-webkit-details-marker { display: none; }
.nav-kap > summary:hover { background: color-mix(in srgb, var(--line) 65%, transparent); }
.nav-kap > summary::before { content: ''; flex: none; width: 7px; height: 7px; margin-top: 24px; border-right: 2px solid var(--muted);
  border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; }
.nav-kap[open] > summary::before { transform: rotate(45deg); }
.nav-kap h3 { font-size: 1.08rem; }
.nav-kap h3 span { display: block; margin-bottom: 2px; font: 600 .7rem var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.nav-kap h3 em { font-style: normal; color: var(--muted); margin-left: 6px; }
.nav-kap.allt-klart h3, .nav-kap.allt-klart h3 span { color: var(--ok); }
.nav-kap > p { margin: 2px 6px 8px 22px; font-size: .8rem; color: var(--muted); }
.nav-kap.kommande { opacity: .5; }
@media (max-width: 899px) {
  #stegval { display: block; }
  .logga { margin-right: 0; }
}
@media (min-width: 900px) {
  .topp-inre { max-width: none; padding: 8px 24px; }
  .layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); align-items: start; }
  .sidebar { display: block; position: sticky; top: 57px; height: calc(100vh - 57px); overflow-y: auto;
    padding: 18px 14px 40px; border-right: 1px solid var(--line); }
}

main { max-width: 640px; margin: 0 auto; padding: 8px 16px 96px; }
.liten { font-size: .9rem; color: var(--muted); }
.kicker { font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

.knapp { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px;
  border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); font-weight: 600; cursor: pointer;
  text-decoration: none; color: var(--ink); }
.knapp.primar { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.knapp.klar { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.knapp:disabled { opacity: .5; cursor: default; }
.knapp.bred { width: 100%; }
.knappar { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }

.kort { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 18px; margin: 16px 0; }

/* Hem */
.hjalte { padding: 28px 0 8px; }
.hjalte h1 { font-size: 2.3rem; }
.hjalte p { color: var(--muted); margin-top: 6px; }
.siffror { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
.siffra { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; text-decoration: none; color: var(--ink); }
.siffra b { display: block; font-family: var(--serif); font-size: 1.9rem; line-height: 1.1; }
.siffra span { font-size: .9rem; color: var(--muted); }
.siffra.vantar { border-color: var(--sun); background: var(--sun-soft); }
.intro ul { padding-left: 1.2em; margin: .4em 0 0; }
.intro li { margin: .3em 0; }
.kapitel-huvud { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.stapel { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 12px 0 6px; }
.stapel i { display: block; height: 100%; background: var(--ok); border-radius: 99px; transition: width .4s; }
.stegrader { list-style: none; margin: 8px 0 0; padding: 0; }
.stegrad a, .stegrad div.las { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 12px 4px;
  border-top: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.stegrad .titel { font-weight: 600; }
.stegrad .titel small { display: block; font-weight: 400; color: var(--muted); font-size: .88rem; }
.ring { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .95rem;
  border: 2px solid var(--line); color: var(--muted); }
.stegrad.nasta .ring { border-color: var(--accent); color: var(--accent); }
.stegrad.klart .ring { background: var(--ok); border-color: var(--ok); color: #fff; }
.stegrad.kommer { opacity: .5; }
.prickar { display: inline-flex; gap: 5px; }
.prickar span { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.prickar span.pa { background: var(--ok); }
.kommande { opacity: .55; }
.fot { margin-top: 32px; font-size: .88rem; color: var(--muted); }
.fot button { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; cursor: pointer; }
.varning { background: var(--sun-soft); border-color: transparent; }
.varning ul { margin: .4em 0 0; padding-left: 1.2em; }

/* Steg */
.steghuvud { padding: 16px 0 4px; }
.tillbaka { display: inline-block; margin-bottom: 12px; text-decoration: none; font-weight: 600; }
.steghuvud h1 { font-size: 2rem; margin-top: 4px; }
.steghuvud .en-titel { color: var(--muted); margin: 4px 0 12px; }
.delnav { display: flex; gap: 6px; flex-wrap: wrap; }
.delnav button { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 11px; font-size: .82rem;
  font-weight: 600; cursor: pointer; color: var(--muted); }
.delnav button.pa { background: var(--ok-soft); border-color: transparent; color: var(--ok); }

.del { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 18px; margin: 16px 0; scroll-margin-top: 70px; }
.del-huvud { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
.del-huvud .nr { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700;
  background: var(--accent-soft); color: var(--accent); }
.del.klar .del-huvud .nr { background: var(--ok); color: #fff; }
.del-huvud h2 { font-size: 1.3rem; }
.del-huvud h2 small { display: block; font-family: var(--sans); font-size: .85rem; font-weight: 400; color: var(--muted); }
.del.aha { background: var(--sun-soft); border-color: transparent; }
.del.aha .del-huvud .nr { background: var(--sun); color: #1d1f24; }
.del.aha.klar .del-huvud .nr { background: var(--ok); color: #fff; }
.aha h3 { font-size: 1.35rem; margin-bottom: 10px; }
.aha table.par { border-collapse: collapse; margin: 6px 0 12px; }
.aha table.par td { padding: 4px 18px 4px 0; }
.aha table.par td:first-child { font-family: var(--serif); font-size: 1.15rem; font-weight: 600; }
.aha ul { padding-left: 1.2em; }
.aha li { margin: .35em 0; }
.aha .tips, .aha .bonus { border-left: 3px solid var(--sun); padding-left: 12px; }
.v2 { display: flex; flex-wrap: wrap; gap: 4px; margin: 10px 0; counter-reset: plats; }
.v2 span { position: relative; background: var(--card); border-radius: 10px; padding: 16px 9px 6px; font-family: var(--serif); font-size: 1.02rem; }
.v2 span::before { counter-increment: plats; content: counter(plats); position: absolute; top: 2px; left: 9px; font: 600 .7rem var(--sans); color: var(--muted); }
.v2 span.verb { background: var(--sun); color: #1d1f24; }
.v2 span.verb::before { color: #1d1f24; }

.reglage { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.vaxel { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; overflow: hidden; }
.vaxel button { border: 0; background: none; padding: 8px 12px; font-size: .88rem; font-weight: 600; cursor: pointer; color: var(--muted); min-height: 40px; }
.vaxel button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }

.meningar { list-style: none; margin: 0; padding: 0; }
.mening { display: flex; gap: 12px; align-items: flex-start; padding: 10px 8px; border-top: 1px solid var(--line); border-radius: 10px; transition: background .2s; }
.mening.nu { background: var(--sun-soft); }
.sv { font-family: var(--serif); font-size: 1.4rem; line-height: 1.35; margin: 4px 0 0; }
.en { display: none; color: var(--muted); margin: 2px 0 0; font-size: .95rem; }
.visa-en .en { display: block; }
button.ord { all: unset; cursor: pointer; border-bottom: 1.5px dotted color-mix(in srgb, var(--muted) 60%, transparent); }
button.ord:hover { color: var(--accent); }
button.ord:focus-visible { outline: 2px solid var(--accent); }

.spela { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--accent-soft); color: var(--accent);
  display: inline-grid; place-items: center; cursor: pointer; }
.spela svg { width: 16px; height: 16px; margin-left: 2px; }
.spela.text { width: auto; padding: 0 14px; border-radius: 999px; gap: 6px; display: inline-flex; align-items: center; font-weight: 600; font-size: .88rem; height: 40px; }
.spela.text svg { width: 12px; height: 12px; }
.ingen-rost .spela, .ingen-rost .kraver-rost { opacity: .35; pointer-events: none; }

.testyta { min-height: 140px; }
.fraga { font-family: var(--serif); font-size: 1.3rem; margin: 6px 0 14px; }
.fraga .lucka { display: inline-block; min-width: 3.5em; border-bottom: 2px solid var(--ink); }
.alternativ { display: grid; gap: 10px; }
.alt { text-align: left; padding: 12px 16px; min-height: 52px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); cursor: pointer; font-size: 1.05rem; }
.alt.sv-alt { font-family: var(--serif); font-size: 1.2rem; }
.alt.ratt { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); font-weight: 600; }
.alt.fel { background: var(--fel-soft); border-color: var(--fel); color: var(--fel); animation: skak .35s; }
.alt:disabled { cursor: default; }
@keyframes skak { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.respons { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--ok-soft); }
.respons.fel { background: var(--fel-soft); }
.svarsrad { display: flex; flex-wrap: wrap; gap: 8px; min-height: 60px; padding: 8px; border: 2px dashed var(--line); border-radius: 12px; margin-bottom: 12px; }
.svarsrad.ratt { border-style: solid; border-color: var(--ok); background: var(--ok-soft); }
.svarsrad.fel { border-color: var(--fel); animation: skak .35s; }
.brickor { display: flex; flex-wrap: wrap; gap: 8px; min-height: 48px; }
.bricka { padding: 9px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); font-family: var(--serif); font-size: 1.2rem; cursor: pointer; }
.svarsrad .bricka { background: var(--accent-soft); border-color: transparent; }
.raknare { font-size: .85rem; color: var(--muted); font-weight: 600; }
.lyssnaknapp { display: inline-flex; align-items: center; gap: 10px; }

.ordlista { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.ordlista li { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 12px; background: var(--paper); }
.ordlista .sv-ord { font-family: var(--serif); font-size: 1.2rem; font-weight: 600; }
.ordlista .en-ord { color: var(--muted); font-size: .95rem; }
.ordlista .fack { margin-left: auto; }

.forts { text-align: center; padding: 24px 18px; }
.forts .sv { font-size: 1.3rem; }
.forts .en { display: block; }

.vem { margin-top: 4px; font: 700 .72rem var(--sans); letter-spacing: .07em; text-transform: uppercase; color: var(--accent); }

/* Nu kan du */
.kanlista { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 10px; }
.kanlista li { display: grid; grid-template-columns: 44px 1fr 44px; gap: 12px; align-items: center; padding: 12px; border-radius: 12px; background: var(--paper); transition: background .2s; }
.kanlista li.pa { background: var(--ok-soft); }
.kanbock { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); color: transparent;
  font-size: 1.2rem; font-weight: 700; cursor: pointer; }
.kanlista li.pa .kanbock { background: var(--ok); border-color: var(--ok); color: #fff; }
.kan-en { font-weight: 600; }
.kanlista .sv { font-size: 1.15rem; margin: 2px 0 0; }

/* Färger: stegets delar, en/ett eller ordklass, personer, kapitel */
[data-del="lyssna"] { --c: var(--c-lyssna); --c-soft: var(--c-lyssna-soft); }
[data-del="aha"] { --c: var(--c-aha); --c-soft: var(--c-aha-soft); }
[data-del="testa"] { --c: var(--c-testa); --c-soft: var(--c-testa-soft); }
[data-del="saga"] { --c: var(--c-saga); --c-soft: var(--c-saga-soft); }
[data-del="ord"] { --c: var(--c-ord); --c-soft: var(--c-ord-soft); }
.del[data-del] { border-top: 5px solid var(--c); }
.del[data-del] .del-huvud .nr { background: var(--c-soft); color: var(--c); }
.del[data-del].aha .del-huvud .nr { background: var(--card); }
.del[data-del].klar .del-huvud .nr { background: var(--c); color: var(--card); font-size: 0; }
.del[data-del].klar .del-huvud .nr::after { content: '✓'; font-size: 1rem; }
.delnav button[data-del] { border-color: var(--c-soft); color: var(--c); }
.delnav button[data-del].pa { background: var(--c-soft); border-color: var(--c); }
.delnav button[data-del].pa::after { content: ' ✓'; }
.genus-pa .g-en { --f: var(--g-en); } .genus-pa .g-ett { --f: var(--g-ett); }
.klass-pa .k-v { --f: var(--o-verb); } .klass-pa .k-s { --f: var(--o-subst); }
.klass-pa .k-a { --f: var(--o-adj); } .klass-pa .k-p { --f: var(--o-pron); }
.genus-pa :is(.g-en, .g-ett), .klass-pa :is(.k-v, .k-s, .k-a, .k-p) { color: var(--f); }

      "rubrik": "Yesterday: the -ade ending",
      "html": "<p>To talk about the past, most Swedish verbs simply add <b>-de</b> to the base form. The base form often ends in <i>-a</i>, so you get <b>-ade</b>:</p><table class='par'><tr><td>vakna</td><td>vaknar (now)</td><td>vakna<b>de</b> (past)</td></tr><tr><td>städa</td><td>städar</td><td>städa<b>de</b></td></tr><tr><td>handla</td><td>handlar</td><td>handla<b>de</b></td></tr><tr><td>laga</td><td>lagar</td><td>laga<b>de</b></td></tr></table><p>Just like the present tense, the past looks the same for everyone: <i>jag vaknade, vi vaknade, Karin vaknade</i>.</p><p class='tips'>When you tell a story about yesterday, keep the past tense <b>all the way</b>: <i>Vi vaknade sent. Sedan städade vi. På kvällen lagade vi soppa.</i> It is very common to slip back into <i>lagar</i> or <i>laga</i> in the middle of a story.</p><p class='bonus'><b>Careful with the time:</b> <i>halv tio</i> is 9.30, not 10.30. Swedes count the half <i>towards</i> the next hour: half (of the way) to ten.</p>"

<script>
'use strict';
const DATA = JSON.parse(document.getElementById('data').textContent);
const NYCKEL = 'smasteg.v1';
const DELAR = ['lyssna', 'aha', 'testa', 'saga', 'ord'];
const DELNAMN = { lyssna: 'Lyssna', aha: 'Aha!', testa: 'Testa', saga: 'Säg det', ord: 'Nya ord' };
const DAG = 86400000;
const INTERVALL = [0, 1, 3, 7, 14, 30]; // dagar till nästa ordrunda, per fack
const PLAY = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1.5v13l11-6.5z" fill="currentColor"/></svg>';

// ---------- Sparat läge (bara i den här webbläsaren) ----------
function tomt() { return { steg: {}, ord: {}, visaEn: false, fart: 'normal', sett: false, farg: 'klass' }; }
function las() {
  try {
    const s = JSON.parse(localStorage.getItem(NYCKEL));
    if (s && typeof s === 'object') return Object.assign(tomt(), s);
  } catch (e) {}
  return tomt();
}
function spara() { try { localStorage.setItem(NYCKEL, JSON.stringify(S)); } catch (e) {} }
let S = las();

const allaSteg = DATA.kapitel.flatMap(k => k.steg.map(s => Object.assign({ kapitel: k }, s)));
const byggda = allaSteg.filter(s => !s.kommer);
const hittaSteg = id => allaSteg.find(s => s.id === id);
const delarKlara = id => DELAR.filter(d => (S.steg[id] || {})[d]).length;
const stegKlart = id => delarKlara(id) === DELAR.length;
const nastaSteg = () => byggda.find(s => !stegKlart(s.id));
const antalOrd = () => Object.keys(S.ord).length;
const KOLLDELAR = ['fragor', 'skriv', 'tala', 'kansla'];
const kollStatus = kap => (S.koll || {})[kap.nr] || {};
const kollAntal = kap => KOLLDELAR.filter(d => kollStatus(kap)[d]).length;

function h(tag, attrs, ...barn) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const b of barn.flat()) {
    if (b == null || b === false) continue;
    el.append(b instanceof Node ? b : document.createTextNode(b));
  }

}

function blanda(a) {

  return a;
}

// lokala svenska röst. Inga anrop till andra tjänster.
const Tal = {
  rost: null, klar: false, ljud: null, avbryt: null,
  init() {
    if (!('speechSynthesis' in window)) { this.klar = true; uppdateraRost(); return; }
    const valj = () => {
      const roster = speechSynthesis.getVoices().filter(v => v.localService && /^sv([-_]|$)/i.test(v.lang));
      // bästa rösten först: Premium > Enhanced/Förbättrad > övriga, och sv-SE före andra svenska varianter
      const poang = v => { const n = (v.name + ' ' + v.voiceURI).toLowerCase();
        return (/premium/.test(n) ? 4 : /enhanced|förbättrad|forbattrad/.test(n) ? 2 : 0) + (/^sv[-_]se/i.test(v.lang) ? 1 : 0); };
      this.rost = roster.sort((x, y) => poang(y) - poang(x))[0] || null;
      if (this.rost || this.klar) { this.klar = true; uppdateraRost(); }
    };
    valj();
    speechSynthesis.addEventListener('voiceschanged', valj);
    setTimeout(() => { this.klar = true; valj(); uppdateraRost(); }, 1500);
  },
  finns() { return !!this.rost || !!window.LJUD; },
  stopp() {
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    if (this.ljud) this.ljud.pause();
    if (this.avbryt) this.avbryt();
  },
  fil(text, vem) {
    const L = window.LJUD, r = DATA.roster || {};
    if (!L) return null;
    const t = text.trim();
    return L[(r[vem] || r.berattare) + '|' + t] || L[r.berattare + '|' + t] || null;
  },
  spelaFil(fil, langsam) {
    if (this.avbryt) this.avbryt();
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    return new Promise(res => {
      const a = this.ljud || (this.ljud = new Audio());
      let t0 = 0, klar = false;
      const slut = ok => { if (klar) return; klar = true; this.avbryt = null; res(ok && t0 ? performance.now() - t0 : 0); };
      this.avbryt = () => slut(false);
      a.pause();
      a.src = fil;
      a.defaultPlaybackRate = a.playbackRate = langsam ? 0.75 : 1;
      a.preservesPitch = true; a.webkitPreservesPitch = true;
      a.onplaying = () => { if (!t0) t0 = performance.now(); };
      a.onended = () => slut(true);
      a.onerror = () => slut(false);
      a.play().catch(() => slut(false));
    });
  },
  saga(text, langsam, vem) {
    const fil = this.fil(text, vem);
    if (fil) return this.spelaFil(fil, langsam);
    return new Promise(res => {
      if (!this.rost) { res(0); return; }
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.voice = this.rost; u.lang = this.rost.lang;
      u.rate = langsam ? 0.65 : 0.95;
      let t0 = 0;
      u.onstart = () => { t0 = performance.now(); };
      u.onend = () => res(t0 ? performance.now() - t0 : 1200);
      u.onerror = () => res(0);

    });
  }
};
let korning = 0;
function stoppaAllt() { korning++; Tal.stopp(); }
function spelaEn(text, langsam, vem) { stoppaAllt(); return Tal.saga(text, langsam ?? S.fart === 'langsam', vem); }
async function spelaSekvens(texter, { markera, efter, loop = false, langsam } = {}) {
  if (!Tal.finns()) return false;
  const id = ++korning;
  Tal.stopp();
  const avbruten = () => { markera && markera(-1); return false; };
  do {
    for (let i = 0; i < texter.length; i++) {
      if (id !== korning) return avbruten();
      markera && markera(i);
      const t = texter[i];
      const tid = await Tal.saga(t.sv ?? t, langsam, t.vem);
      // pausen kollas var 100:e ms så att Stopp märks direkt
      const slut = performance.now() + (efter ? efter(tid) : 500);
      while (id === korning && performance.now() < slut) await vanta(100);
      if (id !== korning) return avbruten();

}

function fraga(q, nasta, autoSpela) {

        h('button', { class: 'bricka', lang: 'sv', onclick: () => { valda.push(k); ritaOm(); kolla(); } }, q.ord[k])));
    };
    const kolla = () => {
      if (valda.length < q.ord.length) return;
      if (valda.every((k, j) => k === j)) {
        rad.classList.add('ratt');
        rad.replaceChildren(h('span', { class: 'fraga', lang: 'sv', style: 'margin:4px' }, svar));
        brickor.remove();
        spelaEn(svar);
        respons.replaceChildren(h('p', { class: 'respons' }, h('b', {}, 'Rätt! '), h('span', { lang: 'en' }, 'Say it out loud once.')), nastaKnapp());
      } else {
        rad.classList.remove('fel'); void rad.offsetWidth; rad.classList.add('fel');

      h('p', { class: 'fraga', lang: 'en', style: 'margin-top:14px' }, q.fraga),
      Tal.finns() ? null : h('p', {}, visaText));
    if (autoSpela) setTimeout(() => { if (box.isConnected) spelaEn(q.sv); }, 300);
  } else {
    const delar = q.fraga.split('___');
    box.append(h('p', { class: 'fraga', lang: delar.length > 1 ? 'sv' : 'en', style: delar.length > 1 ? '' : 'font-family:var(--sans);font-size:1.1rem' },
      delar.length > 1 ? [delar[0], h('span', { class: 'lucka' }, ' '), delar[1]] : q.fraga));
  }

  const knappar = blanda(q.alternativ).map(alt => h('button', { class: 'alt' + (svSomAlt ? ' sv-alt' : ''), lang: svSomAlt ? 'sv' : 'en', onclick: e => {

    } else {

    } }, t)));

}
function skrivFraga(q, box, nastaKnapp, autoSpela) {
  const diktamen = q.typ === 'diktamen';
  const svar = diktamen ? [q.sv] : [].concat(q.ratt);
  const helMening = diktamen ? q.sv : q.fraga.replace('___', svar[0]);
  const respons = h('div');
  let forsok = 0, klar = false;
  const lyckades = () => {
    klar = true;

    spelaEn(helMening);
    respons.replaceChildren(h('p', { class: 'respons' }, h('b', {}, 'Rätt! '), h('span', { lang: 'sv' }, helMening),
      q.forklaring ? h('span', { lang: 'en' }, ' ' + q.forklaring) : null), nastaKnapp());
  };
  const kolla = () => {
    if (klar || !falt.value.trim()) return;
    const v = normText(falt.value);
    if (svar.some(r => normText(r) === v)) return lyckades();
    forsok++;
    const delar = [];
    if (svar.some(r => utanPrickar(r) === utanPrickar(falt.value))) delar.push(h('span', { lang: 'en' }, 'Almost! Check å, ä and ö.'));

    } else delar.push(h('span', { lang: 'en' }, 'Not quite. Try again.'));
    respons.replaceChildren();
    fyll(respons, h('p', { class: 'respons fel' }, delar),

        falt.value = svar[0]; lyckades();
      } }, 'Visa svaret')));
  };
  const { falt, tecken } = skrivFalt(kolla);
  if (diktamen) {
    fyll(box, h('p', { class: 'fraga', lang: 'en', style: 'font-family:var(--sans);font-size:1rem' }, '✍️ Listen and write what you hear:'),
      h('div', { class: 'lyssnaknapp' },

    if (autoSpela) setTimeout(() => { if (box.isConnected) spelaEn(q.sv); }, 300);

      h('p', { class: 'fraga', lang: 'sv' }, fore, h('span', { class: 'lucka' }, '\u00a0'), efter, ' ', h('span', { class: 'grundform' }, `(${q.grund})`)));
  }

  const respons = h('div');
  const { falt, tecken } = skrivFalt(() => {}, true);
  const jamfor = h('button', { class: 'knapp primar', onclick: () => {
    if (falt.value.trim().split(/\s+/).length < 3) { respons.replaceChildren(h('p', { class: 'respons fel', lang: 'en' }, 'Write a little more first 🙂')); return; }
    jamfor.remove();
    respons.replaceChildren(
      h('p', { lang: 'en', style: 'margin-top:12px' }, h('b', {}, 'Check your text:')),
      h('ul', { class: 'kollista', lang: 'en' }, q.kolla.map(k => h('li', {}, h('label', {}, h('input', { type: 'checkbox' }), h('span', { html: k }))))),
      h('div', { class: 'exempel' }, h('div', { class: 'kicker' }, 'Example'), h('p', { class: 'sv', lang: 'sv', style: 'font-size:1.15rem' }, farga(q.exempel))),
      nastaKnapp());
  } }, 'Jämför');
  fyll(box, h('p', { class: 'fraga', lang: 'en', style: 'font-family:var(--sans);font-size:1.05rem' }, '📝 ' + q.uppgift),
    h('p', { class: 'liten', lang: 'en' }, 'Nobody else sees what you write, and it is not saved.'),
    falt, tecken, h('div', { class: 'knappar' }, jamfor), respons);
  return box;
}

function delSaga(steg) {
  const rader = steg.meningar.map(m => h('li', { class: 'mening' + (m.vem ? personKlass(m.vem) : '') },
    h('div', { style: 'flex:1' }, m.vem && h('div', { class: 'vem' }, m.vem), h('p', { class: 'sv', lang: 'sv' }, farga(m.sv)), h('p', { class: 'en', lang: 'en' }, m.en),
      h('div', { class: 'reglage', style: 'margin:8px 0 0' },
        h('button', { class: 'spela text', html: PLAY + 'Långsamt', onclick: () => spelaEn(m.sv, true, m.vem) }),
        h('button', { class: 'spela text', html: PLAY + 'Normalt', onclick: () => spelaEn(m.sv, false, m.vem) })))));
  const markeraRad = i => rader.forEach((r, j) => r.classList.toggle('nu', i === j));
  const loopKnapp = h('button', { class: 'knapp kraver-rost', onclick: async () => {
    if (loopKnapp.dataset.pa) { stoppaAllt(); return; }
    loopKnapp.dataset.pa = '1'; loopKnapp.textContent = '■ Stopp';
    await spelaSekvens(steg.meningar, { markera: markeraRad, loop: true, langsam: S.fart === 'langsam', efter: tid => tid * 1.3 + 900 });
    delete loopKnapp.dataset.pa; loopKnapp.textContent = '∞ Lyssna och säg efter';
  } }, '∞ Lyssna och säg efter');
  return sektion('saga', '',
    delHuvud('saga', 4, 'Säg det', 'Say it out loud.'),
    h('ol', { lang: 'en', style: 'margin:0 0 12px;padding-left:1.2em' },
      h('li', {}, 'Play a sentence slowly and say it at the same time as the voice.'),
      h('li', {}, 'Then at normal speed.'),
      h('li', {}, 'Then press ∞: it plays every sentence and leaves a pause for you to repeat. Good for doing the dishes!')),
    h('div', { class: 'reglage' }, loopKnapp),
    h('ol', { class: 'meningar' }, rader),
    h('div', { class: 'knappar' }, klarknapp(steg, 'saga', 'Jag har sagt dem högt', 'Sagt')));
}

function delOrd(steg) {
  const lista = h('ul', { class: 'ordlista' }, steg.ord.map(o => h('li', {},
    h('button', { class: 'spela', 'aria-label': 'Lyssna: ' + o.sv, html: PLAY, onclick: () => spelaEn(o.sv) }),
    h('div', {}, h('div', { class: 'sv-ord', lang: 'sv' }, farga(o.sv)), h('div', { class: 'en-ord', lang: 'en' }, o.en)))));
  const knapp = h('button', { class: 'knapp', 'data-klarknapp': 'ord', 'data-text': `Spara i ordbanken (+${steg.ord.length} ord)`, 'data-klartext': 'Sparade i ordbanken',
    onclick: () => {
      for (const o of steg.ord) if (!S.ord[o.sv]) S.ord[o.sv] = { en: o.en, fack: 0, due: Date.now() };
      spara();
      markera(steg, 'ord');
      uppdateraChip();
    } }, '');
  return sektion('ord', '',
    delHuvud('ord', 5, 'Nya ord', 'New words. Save them and they will come back in a word round.'),
    lista, h('div', { class: 'knappar' }, knapp));
}

// ---------- Nu kan du … (efter ett kapitel) ----------
function visaKan(kap) {
  const app = document.getElementById('app');
  const lista = h('ul', { class: 'kanlista' }, kap.nuKanDu.map((k, i) => {
    const knapp = h('button', { class: 'kanbock', 'aria-pressed': String(kanLista(kap).includes(i)), 'aria-label': 'Jag kan det: ' + k.en, onclick: () => {
      const fore = kanKlart(kap);
      const set = new Set(kanLista(kap));
      if (set.has(i)) set.delete(i); else set.add(i);
      S.kan = Object.assign({}, S.kan, { [kap.nr]: [...set] });
      spara();
      knapp.setAttribute('aria-pressed', String(set.has(i)));
      li.classList.toggle('pa', set.has(i));
      uppdateraChip();
      if (!fore && kanKlart(kap)) fest({ stor: '🏆', rubrik: `Kapitel ${kap.nr}: allt avbockat!`,
        text: 'You can really do all of this now. Fantastiskt!', knapp: 'Till kartan', href: '#' });
    } }, '✓');
    const li = h('li', { class: kanLista(kap).includes(i) ? 'pa' : '' }, knapp,
      h('div', {}, h('div', { class: 'kan-en', lang: 'en' }, k.en), h('p', { class: 'sv', lang: 'sv' }, k.sv)),
      h('button', { class: 'spela', 'aria-label': 'Lyssna: ' + k.sv, html: PLAY, onclick: () => spelaEn(k.sv) }));
    return li;
  }));
  fyll(app,
    h('section', { class: 'steghuvud' }, h('a', { class: 'tillbaka', href: '#' }, '← Kartan'),
      h('div', { class: `kicker kapfarg kap-${kap.nr}` }, `Kapitel ${kap.nr} · ${kap.titel}`),
      h('h1', {}, 'Nu kan du …'),
      h('p', { class: 'en-titel', lang: 'en' }, 'Read each sentence aloud. Tick it when you feel you could do it in real life.')),
    rostInfo(),
    h('section', { class: 'kort' }, lista));
}

// ---------- Koll vartannat kapitel ----------
function visaKoll(kap) {
  const app = document.getElementById('app');
  const k = kap.koll;
  const markeraKoll = (del, varde = true) => {
    const fore = kollKlart(kap);
    S.koll = Object.assign({}, S.koll, { [kap.nr]: Object.assign({}, kollStatus(kap), { [del]: varde }) });
    spara();
    document.querySelectorAll('[data-kolldel]').forEach(el => el.classList.toggle('klar', !!kollStatus(kap)[el.dataset.kolldel]));
    uppdateraChip();
    if (!fore && kollKlart(kap)) setTimeout(() => fest({ stor: '🌟', rubrik: `Koll ${k.nr} klar!`,
      text: 'Well done. Every check-up shows what is going well and what to practise next.', knapp: 'Till kartan', href: '#' }), 350);
  };
  const del = (namn, farg, nr, titel, en, ...barn) => h('section', { class: 'del', 'data-del': farg, 'data-kolldel': namn },
    delHuvud(farg, nr, titel, en), ...barn);

  // 1. blandade frågor från tidigare kapitel
  const yta = h('div', { class: 'testyta', 'aria-live': 'polite' });
  let i = kollStatus(kap).fragor ? k.fragor.length : 0;
  const ritaFragor = (autoSpela = true) => {
    yta.replaceChildren();
    if (i >= k.fragor.length) {
      markeraKoll('fragor');
      yta.append(h('p', { class: 'respons' }, h('b', {}, 'Klart! '), h('span', { lang: 'en' }, 'All questions done.')),
        h('div', { class: 'knappar' }, h('button', { class: 'knapp', onclick: () => { i = 0; ritaFragor(); } }, 'Gör om')));
      return;
    }
    yta.append(h('div', { class: 'raknare' }, `Fråga ${i + 1} av ${k.fragor.length}`), fraga(k.fragor[i], () => { i++; ritaFragor(); }, autoSpela));
  };
  ritaFragor(false);

  // 2. skriv själv (sparas inte)
  const skrivBox = frittFraga(k.skriv, h('div'), () => { markeraKoll('skriv'); return h('p', { class: 'respons', lang: 'en' }, '✓ Done. Great work!'); });

  // 3. tala
  const talKnapp = h('button', { class: 'knapp primar', onclick: () => { markeraKoll('tala'); talKnapp.textContent = '✓ Gjort'; talKnapp.className = 'knapp klar'; } },
    kollStatus(kap).tala ? '✓ Gjort' : 'Jag har gjort det');
  if (kollStatus(kap).tala) talKnapp.className = 'knapp klar';

  // 4. hur kändes det?
  const kanslor = [['latt', '😌 Easy'], ['lagom', '🙂 Just right'], ['svart', '😅 Hard']];
  const kanslaSvar = h('div');
  const kanslaKnappar = h('div', { class: 'fb-val', role: 'group', 'aria-label': 'How did it feel?' }, kanslor.map(([v, t]) =>
    h('button', { type: 'button', 'aria-pressed': String(kollStatus(kap).kansla === v), onclick: () => {
      markeraKoll('kansla', v);
      kanslaKnappar.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.textContent === t)));
      kanslaSvar.replaceChildren(h('p', { class: 'liten', lang: 'en' }, 'Want to let the person who helps you know? It opens the feedback form.'),
        h('button', { class: 'knapp', onclick: () => skickaFeedback(`📊 Koll ${k.nr}`, `Kändes: ${t}`, `Koll ${k.nr} (efter kapitel ${kap.nr})`) }, 'Skicka hur det kändes'));
    } }, t)));

  fyll(app,
    h('section', { class: 'steghuvud' }, h('a', { class: 'tillbaka', href: '#' }, '← Kartan'),
      h('div', { class: `kicker kapfarg kap-${kap.nr}` }, `Efter kapitel ${kap.nr}`),
      h('h1', {}, `Koll ${k.nr}`),
      h('p', { class: 'en-titel', lang: 'en' }, 'A short check-up, about 10 minutes. It is not a test you can fail: it shows what is going well and what to practise next.')),
    rostInfo(),
    del('fragor', 'testa', 1, 'Blandade frågor', 'Mixed questions from the chapters so far.', yta),
    del('skriv', 'ord', 2, 'Skriv', 'Write on your own.', skrivBox),
    del('tala', 'saga', 3, 'Prata', 'Speak on your own.', h('p', { lang: 'en' }, '🗣️ ' + k.tala), h('div', { class: 'knappar' }, talKnapp)),
    del('kansla', 'lyssna', 4, 'Hur kändes det?', 'How did it feel?', kanslaKnappar, kanslaSvar),
    h('section', { class: 'kort hjalparruta' },
      h('div', { class: 'kicker' }, 'Till dig som hjälper någon att öva'),
      h('p', {}, 'Gör gärna en egen liten koll också: be personen skriva tre meningar om igår och prata ungefär 30 sekunder om helgen. Titta efter:'),
      h('ul', {}, h('li', {}, 'ordföljden efter tidsord (Sen åkte vi, inte Sen vi åkte)'), h('li', {}, 'dåtid hela vägen'),
        h('li', {}, 'en/ett och å, ä, ö'), h('li', {}, 'på/till i stället för för'), h('li', {}, 'hur flytande det går')),
      h('p', {}, 'Berätta sedan för Claude vad du märkte, så anpassas nästa kapitel.')));
  document.querySelectorAll('[data-kolldel]').forEach(el => el.classList.toggle('klar', !!kollStatus(kap)[el.dataset.kolldel]));
}

// ---------- Ordbanken och ordrundan ----------
function visaOrdbank() {
  const app = document.getElementById('app');
  const ord = Object.entries(S.ord).sort(([a], [b]) => a.replace(/^(en|ett) /, '').localeCompare(b.replace(/^(en|ett) /, ''), 'sv'));
  const vantar = ordSomVantar().length;
  fyll(app,
    h('section', { class: 'steghuvud' }, h('a', { class: 'tillbaka', href: '#' }, '← Kartan'),
      h('h1', {}, 'Ordbanken'), h('p', { class: 'en-titel', lang: 'en' }, `${ord.length} words so far. The dots show how well each word sits.`),
      h('div', { class: 'reglage' }, fargKnapp()), fargForklaring()),
    vantar ? h('a', { class: 'knapp primar bred', href: '#runda' }, `Ordrunda: ${vantar} ord väntar`)
      : h('p', { class: 'liten', lang: 'en' }, ord.length ? 'No words to review right now. They will come back in a few days.' : 'Finish the “Nya ord” part of a step to fill your word bank.'),
    ord.length ? h('section', { class: 'kort' }, h('ul', { class: 'ordlista' }, ord.map(([sv, o]) => h('li', {},
      h('button', { class: 'spela', 'aria-label': 'Lyssna: ' + sv, html: PLAY, onclick: () => spelaEn(sv) }),
      h('div', {}, h('div', { class: 'sv-ord', lang: 'sv' }, farga(sv)), h('div', { class: 'en-ord', lang: 'en' }, o.en)),
      h('span', { class: 'prickar fack', 'aria-label': `nivå ${o.fack} av 5` }, [1, 2, 3, 4, 5].map(n => h('span', { class: o.fack >= n ? 'pa' : '' }))))))) : null);
}
function visaRunda() {
  const app = document.getElementById('app');
  const ko = blanda(ordSomVantar());
  const totalt = ko.length;
  let klara = 0;
  const yta = h('section', { class: 'kort flashkort' });
  fyll(app, h('section', { class: 'steghuvud' }, h('a', { class: 'tillbaka', href: '#' }, '← Kartan'), h('h1', {}, 'Ordrunda'),
    h('p', { class: 'en-titel', lang: 'en' }, 'See the Swedish word. Think of what it means. Then check.')), rostInfo(), yta);
  const rita = () => {
    if (!ko.length) {
      yta.replaceChildren(h('div', { class: 'stor', style: 'font-size:2.5rem' }, totalt ? '🌟' : '✓'),
        h('h2', { style: 'margin:8px 0' }, totalt ? 'Ordrundan klar!' : 'Inget att repetera'),
        h('p', { lang: 'en' }, totalt ? `${totalt} words reviewed. They will come back later, a little further apart each time.` : 'Come back in a day or two.'),
        h('a', { class: 'knapp primar', href: '#' }, 'Till kartan'));
      if (totalt) konfetti();
      uppdateraChip();
      return;
    }
    const sv = ko[0], o = S.ord[sv];
    const svar = h('p', { class: 'svar', lang: 'en' });
    const knappar = h('div', { class: 'knappar', style: 'justify-content:center' });
    const visa = h('button', { class: 'knapp primar', onclick: () => {
      svar.textContent = o.en;
      visa.remove();
      knappar.append(
        h('button', { class: 'knapp', onclick: () => { o.fack = 0; o.due = Date.now(); spara(); ko.push(ko.shift()); rita(); } }, 'Inte än'),
        h('button', { class: 'knapp primar', onclick: () => {
          o.fack = Math.min(o.fack + 1, INTERVALL.length - 1); o.due = Date.now() + INTERVALL[o.fack] * DAG; spara();
          ko.shift(); klara++; rita();
        } }, '✓ Kunde det'));
    } }, 'Visa svaret');
    knappar.append(visa);
    yta.replaceChildren(h('div', { class: 'raknare' }, `${klara + 1} av ${totalt}`),
      h('div', { class: 'sv-ord', lang: 'sv' }, farga(sv)),
      h('button', { class: 'spela', 'aria-label': 'Lyssna', html: PLAY, onclick: () => spelaEn(sv) }),
      svar, knappar);
    spelaEn(sv);
  };
  rita();
}

// ---------- Vägvisare ----------
function rita() {
  stoppaAllt(); stangOrd(); stangFest();
  const app = document.getElementById('app');
  app.replaceChildren();
  app.classList.remove('visa-en');
  document.body.classList.toggle('genus-pa', S.farg === 'genus');
  document.body.classList.toggle('klass-pa', (S.farg || 'klass') === 'klass');
  const vag = location.hash.replace(/^#/, '');
  const steg = vag.startsWith('steg/') && hittaSteg(vag.slice(5));
  if (steg && !steg.kommer) visaSteg(steg);
  else if (vag === 'ord') visaOrdbank();
  else if (vag === 'runda') visaRunda();
  else if (vag.startsWith('kan/') && DATA.kapitel.some(k => k.nuKanDu && 'kan/' + k.nr === vag)) visaKan(DATA.kapitel.find(k => 'kan/' + k.nr === vag));
  else if (vag.startsWith('koll/') && DATA.kapitel.some(k => k.koll && 'koll/' + k.nr === vag)) visaKoll(DATA.kapitel.find(k => 'koll/' + k.nr === vag));
  else visaHem();
  uppdateraChip();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', rita);
Tal.init();
rita();
</script>
</body>
</html>
